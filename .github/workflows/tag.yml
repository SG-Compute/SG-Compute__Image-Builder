name: Tag

on:
  push:
    tags: ['v*']

permissions:
  contents: write          # release creation

jobs:
  e2e-and-release:
    name:     E2E and release
    runs-on:  ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache:          'pip'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Build zipapp
        run: python scripts/build_zipapp.py

      - name: Run E2E suite
        # E2E is opt-in via SGI_E2E_ENABLED. Until AWS secrets are
        # configured the placeholder suite is skipped at the test layer.
        env:
          SGI_E2E_ENABLED:        '1'
          SGI_S3_TESTS_ENABLED:   '1'
          AWS_ACCESS_KEY_ID:      ${{ secrets.AWS_E2E_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY:  ${{ secrets.AWS_E2E_SECRET_ACCESS_KEY }}
          AWS_REGION:             eu-west-2
        run: pytest sg_image_builder__tests/end_to_end/ -v

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files:                 dist/sgi.zipapp
          generate_release_notes: true
