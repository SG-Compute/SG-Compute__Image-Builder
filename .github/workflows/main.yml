name: Main

on:
  push:
    branches: [main, dev]

concurrency:
  group:               main-${{ github.ref }}
  cancel-in-progress:  false

permissions:
  contents: write          # auto-tag needs to push tags

jobs:
  lint-and-typecheck:
    name:     Lint and typecheck
    runs-on:  ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache:          'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]
      - run: ruff check sg_image_builder/ sg_image_builder__tests/
      - run: ruff format --check sg_image_builder/ sg_image_builder__tests/
      - run: mypy sg_image_builder/

  unit-tests:
    name:     Unit tests
    runs-on:  ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache:          'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - run: |
          pytest sg_image_builder__tests/unit/ -v \
            --cov=sg_image_builder \
            --cov-report=xml \
            --cov-fail-under=90

  integration-tests:
    name:     Integration tests
    runs-on:  ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache:          'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - run: pytest sg_image_builder__tests/integration/ -v

  build-zipapp:
    name:     Build zipapp
    runs-on:  ubuntu-latest
    needs:    [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache:          'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Build
        run: python scripts/build_zipapp.py
      - name: Smoke-test the zipapp
        run: python dist/sgi.zipapp --version
      - uses: actions/upload-artifact@v4
        with:
          name:          sgi-zipapp-${{ github.sha }}
          path:          dist/sgi.zipapp
          retention-days: 30

  auto-tag:
    name:     Auto-tag on main
    runs-on:  ubuntu-latest
    needs:    [build-zipapp]
    if:       github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token:       ${{ secrets.GITHUB_TOKEN }}
      - name: Read version file
        id:   version
        run:  echo "version=$(cat sg_image_builder/version)" >> "$GITHUB_OUTPUT"
      - name: Create tag if it does not already exist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! git rev-parse "$VERSION" >/dev/null 2>&1; then
            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git tag "$VERSION"
            git push origin "$VERSION"
          else
            echo "tag $VERSION already exists - skipping"
          fi
